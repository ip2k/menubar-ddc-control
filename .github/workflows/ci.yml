name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build number = commit count
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - name: Test
        run: swift test
      - name: Build app and disk image
        run: |
          ./scripts/build-app.sh
          ./scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: build/*.dmg
          retention-days: 14
